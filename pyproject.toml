# Lint configuration only. This repository is a small application, not a package.
#
# The rule set is pinned rather than left to ruff's defaults, which widen between
# releases. A check that passes locally and fails in CI is worse than no check.

[tool.ruff]
line-length = 100
# The original challenge notebooks are kept as submitted, as provenance for what
# the first model actually did. They are not reformatted to suit a later linter.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: The pipeline reproduces the published run
        # Recomputes everything and compares against the committed run. The
        # environment block is excluded, since the Python version and the
        # timestamp differ here from the machine that produced the file.
        run: python -m dps.pipeline --check

      - name: The pandemic-free re-run reproduces too
        # The README says most of the published margin does not survive a move to
        # an ordinary period. That is the least comfortable claim in the document,
        # so it is recomputed here rather than trusted.
        run: python -m dps.robustness --check

      - name: README and docs still match the run
        run: python scripts/check_claims.py

      - name: Figures regenerate
        run: python scripts/figures/generate_figures.py
